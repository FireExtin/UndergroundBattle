[package]
name = "hegemony-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "hegemony-server"

[features]
default = ["native"]
society-fixtures = []
native = ["dep:axum", "dep:tokio", "dep:rusqlite", "dep:sha2", "dep:getrandom", "dep:async-stream", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "hegemony-server"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "hegemony-audit"
path = "src/bin/hegemony-audit.rs"
required-features = ["native"]

[dependencies]
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
