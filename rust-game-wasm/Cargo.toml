[package]
name = "hegemony-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hegemony-server = { path = "../rust-game", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.104"
